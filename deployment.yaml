apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: road-hazard-portal
  template:
    metadata:
      labels:
        app: road-hazard-portal
    spec:
      containers:
        - name: road-hazard-portal
          image: YOUR_DOCKERHUB_USERNAME/road-hazard-portal:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-service
spec:
  type: NodePort
  selector:
    app: road-hazard-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080